name: "publish"

on:
  push:
    branches: "**"
    tags-ignore: ["**"]
  release:
    types: [ "released" ]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref || '' }}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "setup"
        id: "setup"
        uses: "KyoriPowered/ci-cookbook/actions/setup-python-env@ce1dea3f90f8e361ed19afb2c914ab0fdcf42fef" # 2025.12.18
      - name: "setup / install deps"
        run: "poetry install"
      - name: "build wheel"
        run: "poetry build"
      - name: "upload artifact"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
        with:
          name: "python-package-distributions"
          path: "dist/"
  publish-to-pypi:
    if: "${{ github.event_name == 'release' }}"
    runs-on: "ubuntu-latest"
    needs: "build"
    permissions:
      id-token: "write"
      attestations: "write"
      contents: "write"
    environment:
      name: "pypi"
      url: "https://pypi.org/p/pygments-minimessage"
    steps:
      - name: "download artifact"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093" # v4.3.0
        with:
          name: "python-package-distributions"
          path: "dist/"
      - name: "publish / pypi"
        uses: "pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e" # v1.13.0
      - name: "publish / release"
        uses: "softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b" # v2.5.0
        with:
          files: |
            dist/**
  publish-to-testpypi:
    if: "${{ github.event_name == 'workflow_dispatch' }}"
    runs-on: "ubuntu-latest"
    needs: "build"
    permissions:
      id-token: "write"
    environment:
      name: "testpypi"
      url: "https://test.pypi.org/p/pygments-minimessage"
    steps:
      - name: "download artifact"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093" # v4.3.0
        with:
          name: "python-package-distributions"
          path: "dist/"
      - name: "publish / testpypi"
        uses: "pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e" # v1.13.0
        with:
          repository-url: "https://test.pypi.org/legacy/"
          verbose: true

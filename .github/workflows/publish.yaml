name: "publish"

on:
  push:
    branches: "**"
    tags-ignore: ["**"]
  release:
    types: [ "released" ]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref || '' }}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "setup"
        id: "setup"
        uses: "KyoriPowered/ci-cookbook/actions/setup-python-env@f3b9a3fbb31e9f4320d855e7be17b028522e87be" # 2026.02.07
      - name: "setup / install deps"
        run: "poetry install"
      - name: "build wheel"
        run: "poetry build"
      - name: "upload artifact"
        uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f" # v6.0.0
        with:
          name: "python-package-distributions"
          path: "dist/"
  publish-to-pypi:
    if: "${{ github.event_name == 'release' }}"
    runs-on: "ubuntu-latest"
    needs: "build"
    permissions:
      id-token: "write"
      attestations: "write"
      contents: "write"
    environment:
      name: "pypi"
      url: "https://pypi.org/p/pygments-minimessage"
    steps:
      - name: "download artifact"
        uses: "actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131" # v7.0.0
        with:
          name: "python-package-distributions"
          path: "dist/"
      - name: "publish / pypi"
        uses: "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33" # v1.14.2
      - name: "publish / release"
        uses: "softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65" # v2.6.2
        with:
          files: |
            dist/**
  publish-to-testpypi:
    if: "${{ github.event_name == 'workflow_dispatch' }}"
    runs-on: "ubuntu-latest"
    needs: "build"
    permissions:
      id-token: "write"
    environment:
      name: "testpypi"
      url: "https://test.pypi.org/p/pygments-minimessage"
    steps:
      - name: "download artifact"
        uses: "actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131" # v7.0.0
        with:
          name: "python-package-distributions"
          path: "dist/"
      - name: "publish / testpypi"
        uses: "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33" # v1.14.2
        with:
          repository-url: "https://test.pypi.org/legacy/"
          verbose: true

name: "publish"

on:
  push:
    branches: "**"
    tags-ignore: ["**"]
  release:
    types: [ "released" ]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref || '' }}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "setup"
        id: "setup"
        uses: "KyoriPowered/ci-cookbook/actions/setup-python-env@f3b9a3fbb31e9f4320d855e7be17b028522e87be" # 2026.02.07
      - name: "setup / install deps"
        run: "poetry install"
      - name: "build wheel"
        run: "poetry build"
      - name: "upload artifact"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "python-package-distributions"
          path: "dist/"
  publish-to-pypi:
    if: "${{ github.event_name == 'release' }}"
    runs-on: "ubuntu-latest"
    needs: "build"
    permissions:
      id-token: "write"
      attestations: "write"
      contents: "write"
    environment:
      name: "pypi"
      url: "https://pypi.org/p/pygments-minimessage"
    steps:
      - name: "download artifact"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: "python-package-distributions"
          path: "dist/"
      - name: "publish / pypi"
        uses: "pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e" # v1.13.0
      - name: "publish / release"
        uses: "softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64" # v3.0.3
        with:
          files: |
            dist/**
  publish-to-testpypi:
    if: "${{ github.event_name == 'workflow_dispatch' }}"
    runs-on: "ubuntu-latest"
    needs: "build"
    permissions:
      id-token: "write"
    environment:
      name: "testpypi"
      url: "https://test.pypi.org/p/pygments-minimessage"
    steps:
      - name: "download artifact"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: "python-package-distributions"
          path: "dist/"
      - name: "publish / testpypi"
        uses: "pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e" # v1.13.0
        with:
          repository-url: "https://test.pypi.org/legacy/"
          verbose: true
